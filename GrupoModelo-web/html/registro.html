<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Modelo | Registro</title>
        <link rel="stylesheet" href="../css/base.css?v=1">
    <link rel="stylesheet" href="../css/inicio.css?v=1">
    <link rel="stylesheet" href="../css/nosotros.css?v=1">
    <link rel="stylesheet" href="../css/contacto.css?v=1">
    <link rel="stylesheet" href="../css/catalogo.css?v=1">
    <link rel="stylesheet" href="../css/producto.css?v=1">
    <link rel="stylesheet" href="../css/carrito.css?v=1">
    <link rel="stylesheet" href="../css/acceso.css?v=1">
    <link rel="stylesheet" href="../css/ajustes.css?v=1">
</head>

<body class="body-app">

    <div class="app-container">

        <!-- Encabezado -->


        <header class="header-app">

            <div class="logo-seccion">

                <div class="logo-circulo-gm">
                    <img src="../img/logo.png" alt="Grupo Modelo">
                </div>

                <div class="logo-texto">
                    <span>GRUPO MODELO</span>
                    <small>MÉXICO</small>
                </div>

            </div>

            <nav class="nav-app">
                <a href="index.html" class="nav-item">Inicio</a>
                <a href="catalogo.html" class="nav-item">Catálogo</a>
                <a href="login.html" class="btn-app btn-yellow">
                    Iniciar sesión
                </a>
            </nav>

        </header>

        <!-- BANNER -->
        <div class="banner-catalogo">
            <h2>Crear una cuenta</h2>
            <a href="catalogo.html" class="carrito-regresar">
                ← Regresar al catálogo
            </a>
        </div>

        <!-- REGISTRO -->
        <main class="registro-contenedor">

            <section class="registro-tarjeta">

                <div class="registro-encabezado">
                    <h1>¡Bienvenido a Grupo Modelo!</h1>
                    <p>
                        Completa tus datos para comenzar
                        a realizar pedidos en nuestra plataforma.
                    </p>
                </div>

                <form id="formRegistro" novalidate>

                    <div class="registro-fila">

                        <div class="registro-campo">
                            <label for="nombre">Nombre(s)</label>
                            <input
                                type="text"
                                id="nombre"
                                placeholder="Ingresa tu nombre"
                                autocomplete="given-name"
                                required>
                        </div>

                        <div class="registro-campo">
                            <label for="apellidos">Apellidos</label>
                            <input
                                type="text"
                                id="apellidos"
                                placeholder="Ingresa tus apellidos"
                                autocomplete="family-name"
                                required>
                        </div>

                    </div>

                    <div class="registro-campo">
                        <label for="correo">Correo electrónico</label>
                        <input
                            type="email"
                            id="correo"
                            placeholder="ejemplo@correo.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="registro-campo">
                        <label for="contrasena">Contraseña</label>
                        <input
                            type="password"
                            id="contrasena"
                            placeholder="Mínimo 8 caracteres"
                            autocomplete="new-password"
                            minlength="8"
                            required>
                    </div>

                    <div class="registro-campo">
                        <label for="confirmarContrasena">
                            Confirmar contraseña
                        </label>
                        <input
                            type="password"
                            id="confirmarContrasena"
                            placeholder="Repite tu contraseña"
                            autocomplete="new-password"
                            required>
                    </div>

                    <p class="registro-ayuda">
                        La contraseña debe contener al menos
                        8 caracteres.
                    </p>

                    <!-- MENSAJE DE VALIDACIÓN -->
                    <p id="registroMensaje"
                       class="registro-mensaje"
                       role="status"
                       aria-live="polite"></p>

                    <button type="submit" class="registro-boton">
                        CREAR CUENTA
                    </button>

                </form>

                <p class="registro-login">
                    ¿Ya tienes una cuenta?
                    <a href="login.html">Inicia sesión</a>
                </p>

            </section>

        </main>

    </div>

    <script src="../js/registro.js"></script>

</body>
</html>
