<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grupo Modelo | Iniciar sesión</title>

        <link rel="stylesheet" href="../css/base.css?v=1">
    <link rel="stylesheet" href="../css/inicio.css?v=1">
    <link rel="stylesheet" href="../css/nosotros.css?v=1">
    <link rel="stylesheet" href="../css/contacto.css?v=1">
    <link rel="stylesheet" href="../css/catalogo.css?v=1">
    <link rel="stylesheet" href="../css/producto.css?v=1">
    <link rel="stylesheet" href="../css/carrito.css?v=1">
    <link rel="stylesheet" href="../css/acceso.css?v=1">
    <link rel="stylesheet" href="../css/ajustes.css?v=1">
</head>

<body class="body-app">

    <div class="app-container">

        <header class="header-app">

            <div class="logo-seccion">

                <div class="logo-circulo-gm">
                    <img src="../img/logo.png" alt="Grupo Modelo">
                </div>

                <div class="logo-texto">
                    <span>GRUPO MODELO</span>
                    <small>MÉXICO</small>
                </div>


            </div>

            <nav class="nav-app">

                <a href="index.html" class="nav-item">
                    Inicio
                </a>

                <a href="catalogo.html" class="nav-item">
                    Catálogo
                </a>

                <a href="registro.html" class="btn-app btn-yellow">
                    Crear cuenta
                </a>

            </nav>

        </header>

        <div class="banner-catalogo">

            <h2>Iniciar sesión</h2>

            <a href="catalogo.html" class="carrito-regresar">
                ← Regresar al catálogo
            </a>

        </div>

        <main class="login-contenedor">

            <section class="login-tarjeta">

                <div class="login-encabezado">

                    <div class="login-icono">🔐</div>

                    <h1>¡Bienvenido de nuevo!</h1>

                    <p>
                        Ingresa tus datos para continuar
                        con tus pedidos en Grupo Modelo.
                    </p>

                </div>

                <form id="formLogin" novalidate>

                    <div class="login-campo">

                        <label for="loginCorreo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="loginCorreo"
                            placeholder="ejemplo@correo.com"
                            autocomplete="email"
                            required>

                    </div>

                    <div class="login-campo">

                        <label for="loginContrasena">
                            Contraseña
                        </label>

                        <div class="login-password">

                            <input
                                type="password"
                                id="loginContrasena"
                                placeholder="Ingresa tu contraseña"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                id="mostrarContrasena"
                                class="login-ver-password"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false">
                                Mostrar
                            </button>

                        </div>

                    </div>

                    <p
                        id="loginMensaje"
                        class="login-mensaje"
                        role="status"
                        aria-live="polite">
                    </p>

                    <!-- BOTÓN -->
                    <button type="submit" class="login-boton">
                        INICIAR SESIÓN
                    </button>

                </form>

                <div class="login-pie">

                    <p>
                        ¿Todavía no tienes una cuenta?
                        <a href="registro.html">
                            Regístrate aquí
                        </a>
                    </p>

                    <a href="catalogo.html" class="login-explorar">
                        Continuar explorando sin iniciar sesión
                    </a>

                </div>

            </section>

        </main>

    </div>

<script src="../js/login.js?v=4"></script>

</body>
</html>
